
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#087F3D"/>
      <stop offset="50%" stop-color="#066631"/>
      <stop offset="100%" stop-color="#034520"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle / Rounded Container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer Ring Accent -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#34D399" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Inner Soft Container -->
  <circle cx="256" cy="240" r="170" fill="#04441F" fill-opacity="0.5"/>
  <circle cx="256" cy="240" r="170" fill="none" stroke="#10B981" stroke-width="4" stroke-opacity="0.6"/>

  <!-- JME Text (White) -->
  <text x="180" y="260" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="105" font-weight="900" fill="#FFFFFF" text-anchor="middle" filter="url(#shadow)" letter-spacing="-2">JME</text>

  <!-- Ads Text (Vibrant Green) -->
  <text x="350" y="260" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="105" font-weight="900" fill="#34D399" text-anchor="middle" filter="url(#shadow)" letter-spacing="-2">Ads</text>

  <!-- Golden BD Pill Badge Below -->
  <g transform="translate(196, 305)">
    <rect width="120" height="44" rx="22" fill="url(#goldGrad)" filter="url(#shadow)"/>
    <text x="60" y="30" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#1C1917" text-anchor="middle" letter-spacing="2">BD</text>
  </g>

  <!-- Sparkle stars top right & bottom left -->
  <path d="M 400 90 Q 400 120 430 120 Q 400 120 400 150 Q 400 120 370 120 Q 400 120 400 90 Z" fill="#FCD34D"/>
  <path d="M 110 390 Q 110 405 125 405 Q 110 405 110 420 Q 110 405 95 405 Q 110 405 110 390 Z" fill="#34D399"/>
</svg>
